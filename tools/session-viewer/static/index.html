<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Quant Agent Session</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <header class="brand">
          <span class="brand-mark">Q</span>
          <div>
            <strong>Quant Agent Session</strong>
            <small>模型交互与 Harness 轨迹</small>
          </div>
        </header>

        <div class="filter-row" role="group" aria-label="事件筛选">
          <button class="active" data-filter="all">全部</button>
          <button data-filter="model">模型</button>
          <button data-filter="evaluate">评价</button>
          <button data-filter="error">错误</button>
        </div>

        <div class="event-count" id="event-count">加载中…</div>
        <nav class="event-list" id="event-list" aria-label="事件列表"></nav>
        <footer>
          <span id="refresh-state">每 5 秒自动刷新</span>
          <button id="refresh-button" type="button">立即刷新</button>
        </footer>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <h1 id="run-title">加载任务…</h1>
            <p id="run-subtitle">正在读取 ledger</p>
          </div>
          <div class="navigation">
            <button id="previous-event" type="button">上一条</button>
            <button id="next-event" type="button">下一条</button>
          </div>
        </header>

        <section class="stats" id="stats"></section>

        <section class="event-header">
          <div>
            <p class="eyebrow">当前事件</p>
            <h2 id="event-title">—</h2>
            <p id="event-subtitle">—</p>
          </div>
          <span class="event-badge" id="event-badge">—</span>
        </section>

        <div class="tabs" role="tablist" aria-label="查看方式">
          <button class="active" data-tab="interaction">交互</button>
          <button data-tab="state">State 输入</button>
          <button data-tab="raw">原始事件</button>
        </div>

        <section class="stage" id="stage" aria-live="polite">
          <div class="empty">正在加载…</div>
        </section>
      </main>
    </div>
  </body>
</html>
