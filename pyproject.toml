[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-quant-research-t3"
version = "0.2.0"
description = "Paper-first AlphaBench T3 harness with isolated verifier runtime"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.18,<5",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
paper = [
  "pyqlib==0.9.7",
  "numpy>=1.23,<2.1",
  "pandas>=1.5,<3",
  "scipy>=1.9,<2",
  "Flask>=2.3,<4",
  "Flask-Cors>=4,<7",
  "tqdm>=4.65,<5",
  "zss>=1.2,<2",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
qharness = "quant_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
