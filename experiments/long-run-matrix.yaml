schema_version: "0.2"
model: "glm-5.3"
base_config: "../configs/paper-t3.yaml"
cost_optimization: false

trajectory_checkpoints:
  evaluator_calls: [50, 100, 250, 500, 1000, 2500, 5000]
  record_tokens: true
  token_budget_is_a_stop_condition: false

groups:
  paper_core:
    enabled: true
    tasks:
      - id: "A1_cot"
        algorithm: "cot"
        seed_collections: ["kbar", "price"]
        rounds: 10
      - id: "A2_tot"
        algorithm: "tot"
        seed_collections: ["kbar", "price"]
        rounds: 3
        candidates_per_node: 6
        top_k: 3
      - id: "A3_ea"
        algorithm: "ea"
        seed_collections: ["kbar", "rolling"]
        generations: 10
        generate_size: 30
        population_size: 30
        mutation_rate: 0.4
        crossover_rate: 0.6

  temporal_generalization:
    enabled: false
    requires_profile: "controlled_oos"
    primary_algorithm: "ea"
    tasks:
      - id: "B1"
        search: ["2020-01-01", "2022-12-31"]
        validation: ["2023-01-01", "2023-12-31"]
        test: ["2024-01-01", "2024-12-31"]
      - id: "B2"
        search: ["2020-01-01", "2023-12-31"]
        validation: ["2024-01-01", "2024-12-31"]
        test: ["2025-01-01", "2025-12-31"]
      - id: "B3"
        search: ["2020-01-01", "2024-12-31"]
        validation: ["2025-01-01", "2025-06-30"]
        test: ["2025-07-01", "2025-12-31"]

  deep_family_research:
    enabled: false
    requires_profile: "agentic_goal_loop"
    fail_safe_factor_evaluations: 5000
    plateau_valid_evaluations: 100
    minimum_hypothesis_branches: 3
    tasks:
      - {id: "C1_momentum", family: "momentum"}
      - {id: "C2_reversal", family: "reversal"}
      - {id: "C3_volume", family: "volume_liquidity"}
      - {id: "C4_volatility", family: "volatility_conditioned"}
      - {id: "C5_price_volume", family: "price_volume_interaction"}

  factor_pool:
    enabled: false
    requires_profile: "agentic_goal_loop"
    id: "D_factor_pool"
    max_submissions: 10
    fail_safe_factor_evaluations: 5000

  loop_control:
    enabled: false
    requires_profile: "agentic_goal_loop"
    fail_safe_factor_evaluations: 5000
    conditions:
      - {id: "E0_original_ea", controller: "original_ea"}
      - {id: "E1_glm_agent", controller: "glm_agent_loop"}

  null_falsification:
    enabled: false
    requires_profile: "null_world"
    tasks:
      - {id: "F1_label_shuffle", environment: "label_shuffle"}
      - {id: "F2_time_permutation", environment: "block_time_permutation"}
      - {id: "F3_null_twin", environment: "null_twin"}
