schema_version: "0.2"
profile: "agentic_goal_loop"
variant_id: "real_t1_cross_regime_trend"
paper_result: false
random_seed: 101

upstream:
  repository: "https://github.com/CityU-MLO/AlphaBench"
  paper_runtime: "third_party/AlphaBench-paper"
  full_commit_sha: "3a880599358fc81d8b3e0ec89419a7912a5dc694"
  engine: "qlib"
  assay_enabled: false

data:
  provider_uri: "data/raw/qlib/releases/2026-07-29/cn_data"
  snapshot_manifest: "data/snapshots/qlib-cn-manifest.json"
  source:
    type: "investment_data_release"
    release_tag: "2026-07-29"
    manifest_url: "https://github.com/chenditc/investment_data/releases/download/2026-07-29/qlib_bin.manifest.json"
    archive_url: "https://github.com/chenditc/investment_data/releases/download/2026-07-29/qlib_bin.tar.gz"
  market: "csi300"
  instruments: "CSI300"
  benchmark: "SH000300"
  frequency: "day"
  label: "close_return"
  start: "2020-01-01"
  end: "2025-12-31"

model:
  provider: "ark_coding_openai"
  model_id: "glm-5.3"
  api_mode: "responses"
  api_key_env: "ARK_API_KEY"
  base_url_env: "ARK_BASE_URL"
  temperature: 0.3
  timeout_seconds: 600

search:
  algorithm: "agentic"
  seed_collections: ["kbar", "price"]
  exclude_variable: "vwap"
  max_seeds: 5
  max_submissions: 1

agentic:
  task_id: "real-t1-cross-regime-trend"
  goal: "Act as an autonomous CSI300 factor researcher. Establish five Alpha158 seed baselines, then discover one interpretable non-reference OHLCV trend or momentum factor. A submission must have successful evidence on search_early, search_late and search_full; on every window its direction-adjusted IC must be at least 0.015 and RankIC must be positive, while search_full direction-adjusted IC must exceed the best evaluated seed and reach 0.03. Prefer structurally meaningful mechanisms over sign, scale or lookback-only rewrites. If no factor survives these gates, conclude no_discovery with counter-evidence. You control hypotheses, evaluations, refinements, pivots and stopping."
  allowed_actions: ["propose", "evaluate", "refine", "pivot", "stop"]
  window_aliases:
    search_full: ["2020-01-01", "2023-12-31"]
    search_early: ["2020-01-01", "2021-12-31"]
    search_late: ["2022-01-01", "2023-12-31"]
  check_period: ["2020-01-01", "2023-12-31"]
  max_candidates_per_action: 4
  safety:
    invalid_action_threshold: 20
    factor_evaluations: 48
    emergency_model_turns: null
    registration_stall_actions: 10
  checkpoints: [5, 10, 20, 32, 48]
  recent_event_window: 24
  plateau_advisory_valid_evaluations: 12

outcome_verification:
  role: "hidden_oos"
  start: "2024-01-01"
  end: "2025-12-31"

candidate_validation:
  policy: "strict"

experiment_objective:
  objective_id: "cross-regime-trend-discovery"
  required_search_windows: ["search_early", "search_late", "search_full"]
  min_direction_adjusted_search_ic: 0.015
  min_direction_adjusted_search_ic_by_window:
    search_full: 0.03
  min_direction_adjusted_search_rank_ic: 0.0
  min_direction_adjusted_hidden_oos_ic: 0.01
  min_direction_adjusted_hidden_oos_rank_ic: 0.0
  require_beats_best_search_seed: true
  min_submissions: 1
  min_distinct_hypotheses: 1
  max_mean_abs_output_correlation: null

paper_metrics:
  effective_ic_threshold: 0.03

runtime:
  run_root: "runs"
  artifact_root: "artifacts"
  trajectory_root: "trajectories"
  search:
    host: "127.0.0.1"
    port: 19901
    cache_path: "runs/runtime/real-t1-search/factor_cache.sqlite"
  verifier:
    host: "127.0.0.1"
    port: 19902
    cache_path: "runs/runtime/real-t1-verifier/factor_cache.sqlite"

extensions:
  controlled_oos: true
  agentic_goal_loop: true
  long_horizon_checkpoints: true
  null_world: false
