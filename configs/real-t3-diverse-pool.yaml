schema_version: "0.2"
profile: "agentic_goal_loop"
variant_id: "real_t3_diverse_factor_pool"
paper_result: false
random_seed: 303

upstream:
  repository: "https://github.com/CityU-MLO/AlphaBench"
  paper_runtime: "third_party/AlphaBench-paper"
  full_commit_sha: "3a880599358fc81d8b3e0ec89419a7912a5dc694"
  engine: "qlib"
  assay_enabled: false

data:
  provider_uri: "data/raw/qlib/releases/2026-07-29/cn_data"
  snapshot_manifest: "data/snapshots/qlib-cn-manifest.json"
  source:
    type: "investment_data_release"
    release_tag: "2026-07-29"
    manifest_url: "https://github.com/chenditc/investment_data/releases/download/2026-07-29/qlib_bin.manifest.json"
    archive_url: "https://github.com/chenditc/investment_data/releases/download/2026-07-29/qlib_bin.tar.gz"
  market: "csi300"
  instruments: "CSI300"
  benchmark: "SH000300"
  frequency: "day"
  label: "close_return"
  start: "2020-01-01"
  end: "2025-12-31"

model:
  provider: "ark_coding_openai"
  model_id: "glm-5.3"
  api_mode: "responses"
  api_key_env: "ARK_API_KEY"
  base_url_env: "ARK_BASE_URL"
  temperature: 0.3
  timeout_seconds: 1200
  max_output_tokens: 65536
  fallback_max_output_tokens: 8192
  fallback_thinking_disabled: false
  fallback_enabled: false
  structured_output: false

search:
  algorithm: "agentic"
  seed_collections: ["kbar", "price"]
  exclude_variable: "vwap"
  max_seeds: 5
  max_submissions: 2

agentic:
  task_id: "real-t3-diverse-factor-pool"
  goal: "Continuously research until a two-factor CSI300 OHLCV pool satisfies the complete search objective. The two factors must come from distinct economic mechanisms; each needs successful search_early, search_late and search_full evidence, direction-adjusted IC at least 0.01 with positive RankIC on every window, and search_full IC above the best seed. Use broad hypothesis exploration, pivots and ablations rather than trivial sign, scale or lookback duplicates. Do not request no_discovery before finalization_required at the evaluation safety ceiling. Submit exactly two immediately once objective_progress.goal_achieved is true; the hidden Verifier will then test OOS IC/RankIC and mean absolute correlation no greater than 0.70."
  allowed_actions: ["propose", "evaluate", "refine", "pivot", "stop"]
  window_aliases:
    search_full: ["2020-01-01", "2023-12-31"]
    search_early: ["2020-01-01", "2021-12-31"]
    search_late: ["2022-01-01", "2023-12-31"]
  check_period: ["2020-01-01", "2023-12-31"]
  max_candidates_per_action: 4
  safety:
    invalid_action_threshold: 40
    factor_evaluations: 128
    emergency_model_turns: null
    registration_stall_actions: 24
  checkpoints: [5, 10, 20, 40, 64, 96, 128]
  recent_event_window: 12
  plateau_advisory_valid_evaluations: 32

outcome_verification:
  role: "hidden_oos"
  start: "2024-01-01"
  end: "2025-12-31"

candidate_validation:
  policy: "strict"

experiment_objective:
  objective_id: "diverse-two-factor-pool"
  required_search_windows: ["search_early", "search_late", "search_full"]
  min_direction_adjusted_search_ic: 0.01
  min_direction_adjusted_search_rank_ic: 0.0
  min_direction_adjusted_hidden_oos_ic: 0.008
  min_direction_adjusted_hidden_oos_rank_ic: 0.0
  require_beats_best_search_seed: true
  min_submissions: 2
  min_distinct_hypotheses: 2
  max_mean_abs_output_correlation: 0.70

paper_metrics:
  effective_ic_threshold: 0.03

runtime:
  run_root: "runs"
  artifact_root: "artifacts"
  trajectory_root: "trajectories"
  search:
    host: "127.0.0.1"
    port: 19905
    cache_path: "runs/runtime/real-t3-search/factor_cache.sqlite"
  verifier:
    host: "127.0.0.1"
    port: 19906
    cache_path: "runs/runtime/real-t3-verifier/factor_cache.sqlite"

extensions:
  controlled_oos: true
  agentic_goal_loop: true
  long_horizon_checkpoints: true
  null_world: false
